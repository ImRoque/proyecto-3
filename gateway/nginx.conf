# API Gateway (docs/arquitectura.md, seccion 5.1).
#
# - Unico punto de entrada para Flutter web y Android.
# - Enruta por prefijo /api/<servicio>/ hacia <servicio>:8000 y conserva la ruta completa.
# - Si un servicio no responde, solo su ruta falla con 503 y el formato de error de docs/api.md.
# - Aplica CORS para que Flutter web pueda llamar desde otro origen.

worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # DNS interno de Docker. Se resuelve el nombre en cada peticion (no al arrancar),
    # asi nginx inicia aunque un servicio este apagado y detecta cuando vuelve.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Nombre del servicio a partir de la ruta; se usa en el mensaje de error 503.
    map $uri $servicio {
        ~^/api/(?<nombre>catalogo|pedidos|recomendar|asistente)/ $nombre;
        default "solicitado";
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;

        # ---------- CORS ----------
        # "always" para que tambien acompanen a los errores 4xx y 503.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Idempotency-Key" always;
        add_header Access-Control-Max-Age "600" always;

        # Preflight: lo responde el gateway sin llegar al servicio.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ---------- Proxy hacia los servicios ----------
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El CORS lo controla solo el gateway; se ignora el que mande un servicio.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # Tiempos limite hacia cada servicio.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Errores del propio gateway al hablar con el servicio (caido, sin DNS, sin tiempo).
        # Los 503 que genere el servicio (p. ej. modelo_no_disponible) pasan sin cambios
        # porque proxy_intercept_errors esta apagado.
        error_page 502 503 504 = @servicio_no_disponible;

        # Con variable en proxy_pass y sin URI, nginx manda la ruta original completa.
        location /api/catalogo/ {
            set $destino catalogo:8000;
            proxy_pass http://$destino;
        }

        location /api/pedidos/ {
            set $destino pedidos:8000;
            proxy_pass http://$destino;
        }

        location /api/recomendar/ {
            set $destino recomendar:8000;
            proxy_pass http://$destino;
        }

        location /api/asistente/ {
            set $destino asistente:8000;
            proxy_pass http://$destino;
        }

        location @servicio_no_disponible {
            default_type "application/json; charset=utf-8";
            return 503 '{"error": "servicio_no_disponible", "detalle": "El servicio $servicio no respondió"}';
        }

        # Cualquier otra ruta no existe.
        location / {
            default_type "application/json; charset=utf-8";
            return 404 '{"error": "ruta_no_encontrada", "detalle": "La ruta solicitada no existe"}';
        }
    }
}
